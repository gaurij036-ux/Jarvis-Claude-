<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS-X — Voice Core</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="core-panel">
        <div class="core" id="core" data-state="idle">
          <div class="core-ring"></div>
          <div class="core-center">
            <span id="stateLabel">IDLE</span>
          </div>
        </div>
        <button id="micToggle" class="mic-toggle">Start listening</button>
        <p class="hint">Say “Jarvis” to wake me, then speak your command.</p>
      </section>

      <section class="readout">
        <header>
          <h1>JARVIS-X <span class="dim">/ voice core</span></h1>
          <p id="greeting" class="dim">Booting…</p>
        </header>

        <div id="log" class="log" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
